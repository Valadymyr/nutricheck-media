<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NutriCheck — сканер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #0f1412);
    --text: var(--tg-theme-text-color, #f3f6f4);
    --hint: var(--tg-theme-hint-color, #9aa6a0);
    --btn: var(--tg-theme-button-color, #2e9d5b);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #1a211e);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { display: flex; flex-direction: column; height: 100%; padding: 12px 14px calc(14px + env(safe-area-inset-bottom)); gap: 12px; }
  .cam { position: relative; flex: 1; min-height: 260px; border-radius: 18px; overflow: hidden; background: #000; }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .frame { position: absolute; left: 8%; right: 8%; top: 32%; height: 36%; border-radius: 14px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,.45); border: 3px solid rgba(255,255,255,.9); }
  .frame::after { content: ""; position: absolute; left: 6%; right: 6%; top: 50%; height: 2px;
    background: #4ade80; box-shadow: 0 0 10px #4ade80; animation: scan 1.6s ease-in-out infinite; }
  .frame.ok { border-color: #4ade80; }
  @keyframes scan { 0%,100% { transform: translateY(-38px); } 50% { transform: translateY(38px); } }
  .torch { position: absolute; right: 12px; top: 12px; width: 44px; height: 44px; border-radius: 50%; border: 0;
    background: rgba(0,0,0,.55); color: #fff; font-size: 20px; display: none; }
  .status { text-align: center; color: var(--hint); min-height: 22px; }
  .status.big { color: var(--text); font-weight: 600; font-size: 18px; }
  .manual { display: flex; gap: 8px; background: var(--card); padding: 8px; border-radius: 14px; }
  .manual input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 17px; padding: 8px; }
  .manual button { border: 0; border-radius: 10px; padding: 0 16px; background: var(--btn); color: var(--btn-text); font-size: 15px; font-weight: 600; }
  .note { font-size: 12px; color: var(--hint); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="cam">
    <video id="v" playsinline muted autoplay></video>
    <div class="frame" id="frame"></div>
    <button class="torch" id="torch" aria-label="Ліхтарик">🔦</button>
  </div>
  <div class="status" id="st">Запускаю камеру…</div>
  <form class="manual" id="mf">
    <input id="mi" inputmode="numeric" pattern="[0-9 ]*" placeholder="або введи цифри штрихкоду" autocomplete="off">
    <button type="submit">Перевірити</button>
  </form>
  <div class="note">Оцінка алгоритму за даними етикетки. Не медична порада.</div>
</div>

<script src="./zxing-reader.js"></script>
<script>
(() => {
  const API = "https://nutricheck.supabase.co/functions/v1/tg-bot";
  const tg = window.Telegram && Telegram.WebApp;
  const initData = tg ? tg.initData : "";
  const st = document.getElementById("st"), video = document.getElementById("v"), frame = document.getElementById("frame");
  const say = (t, big) => { st.textContent = t; st.className = "status" + (big ? " big" : ""); };
  if (tg) { tg.ready(); tg.expand(); }

  if (!initData) {
    say("Відкрий сканер через бота @NutriCheckUA_bot — кнопка «📷 Сканувати».", true);
  }

  // GTIN: 8, 12, 13 або 14 цифр з правильною контрольною цифрою
  function gtinValid(c) {
    if (!/^\d{8}$|^\d{12,14}$/.test(c)) return false;
    const d = c.split("").map(Number), check = d.pop();
    let s = 0; d.reverse().forEach((x, i) => { s += x * (i % 2 === 0 ? 3 : 1); });
    return (10 - (s % 10)) % 10 === check;
  }

  let done = false, stream = null;
  async function submit(code) {
    if (done) return;
    done = true;
    frame.classList.add("ok");
    try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success"); } catch (_) {}
    if (navigator.vibrate) try { navigator.vibrate(60); } catch (_) {}
    say("✅ " + code + " — шукаю товар…", true);
    if (!initData) { say("Відкрий сканер через бота @NutriCheckUA_bot", true); done = false; return; }
    try {
      const r = await fetch(API, { method: "POST", headers: { "content-type": "text/plain" },
        body: JSON.stringify({ action: "webapp_scan", init_data: initData, barcode: code }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw new Error(j.error || r.status);
      say("Готово! Картка товару вже в чаті 👇", true);
      stop();
      setTimeout(() => tg && tg.close(), 700);
    } catch (e) {
      say("Не вдалося надіслати 😕 Спробуй ще раз.", true);
      frame.classList.remove("ok");
      setTimeout(() => { done = false; }, 1500);
    }
  }

  document.getElementById("mf").addEventListener("submit", (e) => {
    e.preventDefault();
    const c = document.getElementById("mi").value.replace(/\D/g, "");
    if (!/^\d{8,14}$/.test(c)) { say("Штрихкод має 8–14 цифр", true); return; }
    submit(c);
  });

  function stop() { if (stream) stream.getTracks().forEach((t) => t.stop()); stream = null; }

  // ── розпізнавання: нативний BarcodeDetector (Android), інакше zxing-wasm (iPhone) ──
  let native = null;
  async function makeNative() {
    try {
      if (!("BarcodeDetector" in window)) return null;
      const f = await BarcodeDetector.getSupportedFormats();
      const want = ["ean_13", "ean_8", "upc_a", "upc_e"].filter((x) => f.includes(x));
      return want.length ? new BarcodeDetector({ formats: want }) : null;
    } catch (_) { return null; }
  }

  let zxReady = null;
  function zx() {
    if (!zxReady) {
      zxReady = ZXingWASM.prepareZXingModule({
        overrides: { locateFile: (p, prefix) => p.endsWith(".wasm") ? new URL("./zxing_reader.wasm", location.href).href : prefix + p },
        fireImmediately: true,
      });
    }
    return zxReady;
  }

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  let hits = {};

  async function tick() {
    if (done || !stream) return;
    const w = video.videoWidth, h = video.videoHeight;
    if (w && h) {
      try {
        let codes = [];
        if (native) {
          const res = await native.detect(video);
          codes = res.map((r) => r.rawValue);
        } else {
          // центральна смуга кадру — швидше і менше хибних
          const cw = Math.round(w * 0.9), ch = Math.round(h * 0.5);
          const scale = Math.min(1, 1000 / cw);
          canvas.width = Math.round(cw * scale); canvas.height = Math.round(ch * scale);
          ctx.drawImage(video, (w - cw) / 2, (h - ch) / 2, cw, ch, 0, 0, canvas.width, canvas.height);
          const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const res = await ZXingWASM.readBarcodes(img, { formats: ["EAN-13", "EAN-8", "UPC-A", "UPC-E"], tryHarder: true, maxNumberOfSymbols: 1 });
          codes = res.map((r) => r.text);
        }
        for (const raw of codes) {
          const c = String(raw).replace(/\D/g, "");
          if (!gtinValid(c)) continue;
          // підтвердження: той самий код двічі поспіль — менше випадкових помилок
          hits[c] = (hits[c] || 0) + 1;
          if (hits[c] >= 2 || native) return submit(c);
        }
      } catch (_) { /* наступний кадр */ }
    }
    setTimeout(tick, native ? 120 : 180);
  }

  async function start() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      say("Камера недоступна в цьому застосунку — введи цифри штрихкоду нижче.", true);
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: false,
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } } });
    } catch (e) {
      say("Немає доступу до камери. Дозволь камеру для Telegram у налаштуваннях телефону або введи цифри нижче.", true);
      return;
    }
    video.srcObject = stream;
    await video.play().catch(() => {});
    const track = stream.getVideoTracks()[0];
    try {
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps.focusMode && caps.focusMode.includes("continuous")) await track.applyConstraints({ advanced: [{ focusMode: "continuous" }] });
      if (caps.torch) {
        const b = document.getElementById("torch"); let on = false;
        b.style.display = "block";
        b.onclick = async () => { on = !on; try { await track.applyConstraints({ advanced: [{ torch: on }] }); } catch (_) {} };
      }
    } catch (_) {}
    native = await makeNative();
    if (!native) { say("Готую сканер…"); await zx(); }
    say("Наведи камеру на штрихкод");
    tick();
  }

  start();
})();
</script>
</body>
</html>
